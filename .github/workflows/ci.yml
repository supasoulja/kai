# Fast feedback on every push. Deliberately does NOT try to be a release.
#
# What CI can and cannot run: 375 of Kai's 431 tests are hermetic and finish in
# ~10s. The other 56 live in tests/test_security.py, which calls setup_app() ->
# _init(); that requires a reachable Ollama AND the ~8 GB chat model, neither of
# which exists on a GitHub runner (it exits 3, so it fails loudly rather than
# silently passing). Those 56 run locally, where scripts/release.sh runs the
# whole suite before any release is cut.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # The package plus its dev tools. Extras are omitted: nothing in the
          # hermetic subset imports faster-whisper or playwright, and pulling
          # them would add minutes for no coverage.
          pip install -e . pytest ruff build

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Test (Ollama-free subset)
        run: pytest -q --ignore=tests/test_security.py

      - name: Build wheel + sdist
        run: python -m build

      - name: Packaging invariants hold for the built wheel
        # Catches the failure mode unit tests cannot: an asset that exists in the
        # repo but never made it into the distributable.
        run: |
          python - <<'PY'
          import zipfile, glob, sys
          whl = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(whl).namelist()
          required = [
              "kai/persona/persona.md",
              "kai/persona/changelog.json",
              "kai/static/app.html",
          ]
          missing = [r for r in required if r not in names]
          prompts = [n for n in names if "persona/crew_prompts/" in n and n.endswith(".md")]
          if missing:
              sys.exit(f"wheel is missing runtime assets: {missing}")
          if not prompts:
              sys.exit("wheel contains no crew prompts")
          print(f"{whl}: {len(names)} files, {len(prompts)} crew prompts, assets present")
          PY

  image:
    # Proves the Dockerfile still builds. Does not push — publishing only ever
    # happens from a tag, via release.yml.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f docker/Dockerfile --build-arg KAI_VERSION=ci -t kai:ci .
      - name: Smoke-test it
        run: |
          docker run --rm -v kai-ci:/data --entrypoint python kai:ci -c "
          import kai, kai.config as c
          c.ensure_dirs()
          from kai.store.db import get_conn; get_conn()
          assert c.PERSONA_PATH.is_file(), 'persona.md missing from image'
          assert list(c.CREW_PROMPTS_DIR.glob('*.md')), 'crew prompts missing from image'
          from kai.tools.design import render, spreadsheet
          r = render.design_render('smoke', '# Smoke\ntest\n\n> ok', 'flyer', 'pdf')
          assert [f['name'] for f in r['files']] == ['smoke.pdf', 'smoke.preview.png'], r
          assert spreadsheet.design_spreadsheet('smoke', 'A,B\n1,2')['files'], 'no xlsx'
          print('image ok:', kai.__version__, '(Chromium and openpyxl work)')
          "
